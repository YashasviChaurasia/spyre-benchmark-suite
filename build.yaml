kind: Pod
apiVersion: v1
metadata:
  name: yc-vllm-spyre-benchmark
  labels:
    deployer: yc
    purpose: benchmark
spec:
  schedulerName: spyre-scheduler
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      # Previous images:
      # image: us.icr.io/wxpe-cicd-internal/amd64/vllm-spyre-dev:dev-next  (full build from source)
      # image: icr.io/ai_sw_accel/2.0/spyre-inference:latest  (missing cpu_worker ops)
      image: icr.io/ai_sw_accel/2.0/torch-spyre:latest
      imagePullPolicy: Always
      resources:
        limits:
          ibm.com/spyre_pf: '2'
        requests:
          ibm.com/spyre_pf: '2'
      workingDir: /home/senuser
      env:
        - name: BENCHMARK_REPO
          value: https://github.com/YashasviChaurasia/spyre-benchmark-suite.git
        - name: BENCHMARK_BRANCH
          value: test/tp1-parallel-run
        - name: SPYRE_INFERENCE_REPO
          value: https://github.com/torch-spyre/spyre-inference.git
        - name: SPYRE_INFERENCE_BRANCH
          value: main
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        - name: HOME
          value: /home/senuser
        - name: HF_HOME
          value: /home/senuser
        - name: FLEX_COMPUTE
          value: SENTIENT
        - name: FLEX_DEVICE
          value: PF
        - name: TOKENIZERS_PARALLELISM
          value: 'false'
        - name: AIU_SETUP_MULTI_AIU
          value: '1'
        - name: AIU_WORLD_SIZE
          value: '2'
        - name: DEEPTOOLS_PATH
          value: /opt/ibm/spyre/deeptools/share
        - name: LD_LIBRARY_PATH
          value: /opt/ibm/spyre/runtime/lib:/opt/ibm/spyre/deeptools/lib:/opt/ibm/spyre/senlib/lib:/opt/ibm/spyre/spyre-comms/lib
        - name: VLLM_CPU_KVCACHE_SPACE
          value: '16'
        - name: DTLOG_LEVEL
          value: error
        - name: SAVE_TO_PYTORCH_BENCHMARK_FORMAT
          value: '1'
      command:
        - bash
        - -c
        - |
            set -ex

            # ---- Phase 1: Shell environment ----
            source $HOME/.bashrc || true
            source /etc/profile.d/ibm-aiu-setup.sh || true
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

            # ---- Phase 2: Activate pre-installed venv + install spyre-inference ----
            cd $HOME
            source torch-spyre/.venv/bin/activate

            echo "=== Installing spyre-inference (vLLM + plugin) from ${SPYRE_INFERENCE_REPO} ==="
            git clone -b "${SPYRE_INFERENCE_BRANCH}" "${SPYRE_INFERENCE_REPO}" spyre-inference
            cd spyre-inference
            # Install vLLM + spyre-inference with deps (reuses pre-built torch-spyre from base)
            uv pip install -e . --no-build-isolation-package vllm
            cd $HOME

            python3 -c "import vllm; print('vLLM version:', vllm.__version__)"
            echo "=== pip freeze ==="
            pip freeze

            # ---- Phase 3: Install benchmark dependencies ----
            pip install pyyaml 2>/dev/null || true
            which jq || (apt-get update -qq && apt-get install -y -qq jq 2>/dev/null) || true

            # ---- Phase 4: Clone benchmark suite ----
            echo "=== Cloning benchmark suite from ${BENCHMARK_REPO} (branch: ${BENCHMARK_BRANCH}) ==="
            git clone -b "${BENCHMARK_BRANCH}" "${BENCHMARK_REPO}" benchmark-suite
            cd benchmark-suite

            # ---- Phase 5: Run benchmarks ----
            echo "=== Starting benchmarks ==="
            bash scripts/run_benchmarks.sh 2>&1 | tee /tmp/benchmark.log

            echo "===== BENCHMARK COMPLETE ====="
      volumeMounts:
        - name: dev-shm
          mountPath: /dev/shm
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
  restartPolicy: Never
  imagePullSecrets:
    - name: ai-sw-accel-pull-secret
    # Previous: wxpe-cicd-vllm-iccr-internal (for vllm-spyre-dev image)
  serviceAccount: default
  volumes:
    - name: dev-shm
      emptyDir: {}
