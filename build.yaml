kind: Pod
apiVersion: v1
metadata:
  name: yc-vllm-spyre-benchmark
  labels:
    deployer: yc
    purpose: benchmark
spec:
  schedulerName: spyre-scheduler
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      # torch-spyre base + build vLLM from source (replicates Dockerfile fix)
      image: icr.io/ai_sw_accel/2.0/torch-spyre:latest
      imagePullPolicy: Always
      resources:
        limits:
          ibm.com/spyre_pf: '2'
        requests:
          ibm.com/spyre_pf: '2'
      workingDir: /dev/shm
      env:
        - name: BENCHMARK_REPO
          value: https://github.com/YashasviChaurasia/spyre-benchmark-suite.git
        - name: BENCHMARK_BRANCH
          value: test/tp1-parallel-run
        - name: SPYRE_INFERENCE_REPO
          value: https://github.com/torch-spyre/spyre-inference.git
        - name: SPYRE_INFERENCE_BRANCH
          value: main
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        - name: HOME
          value: /dev/shm
        - name: HF_HOME
          value: /dev/shm
        - name: FLEX_COMPUTE
          value: SENTIENT
        - name: FLEX_DEVICE
          value: PF
        - name: TOKENIZERS_PARALLELISM
          value: 'false'
        - name: AIU_SETUP_MULTI_AIU
          value: '1'
        - name: AIU_WORLD_SIZE
          value: '2'
        - name: DEEPTOOLS_PATH
          value: /opt/ibm/spyre/deeptools/share
        - name: LD_LIBRARY_PATH
          value: /opt/ibm/spyre/runtime/lib:/opt/ibm/spyre/deeptools/lib:/opt/ibm/spyre/senlib/lib:/opt/ibm/spyre/spyre-comms/lib
        - name: VLLM_CPU_KVCACHE_SPACE
          value: '16'
        - name: DTLOG_LEVEL
          value: error
        - name: SAVE_TO_PYTORCH_BENCHMARK_FORMAT
          value: '1'
      command:
        - bash
        - -c
        - |
            set -ex

            # ---- Phase 1: Shell environment + activate existing venv ----
            source /home/senuser/.bashrc || true
            source /etc/profile.d/ibm-aiu-setup.sh || true
            source /home/senuser/torch-spyre/.venv/bin/activate
            export PATH="/home/senuser/.local/bin:$PATH"

            # ---- Phase 2: Install build deps + Build vLLM from source ----
            # numa.h required for vLLM CPU build (image has numactl but not -devel headers)
            # Download header directly if we can't install via package manager
            if [ ! -f /usr/include/numa.h ]; then
              curl -sL https://raw.githubusercontent.com/numactl/numactl/v2.0.18/numa.h -o /tmp/numa.h
              curl -sL https://raw.githubusercontent.com/numactl/numactl/v2.0.18/numaif.h -o /tmp/numaif.h
              export C_INCLUDE_PATH="/tmp:${C_INCLUDE_PATH:-}"
              export CPLUS_INCLUDE_PATH="/tmp:${CPLUS_INCLUDE_PATH:-}"
            fi
            echo "=== Building vLLM from source for CPU/Spyre ==="
            git clone -b "${SPYRE_INFERENCE_BRANCH}" "${SPYRE_INFERENCE_REPO}" spyre-inference
            cd spyre-inference

            uv pip install cmake numpy setuptools-scm wheel ninja expecttest

            # Build vLLM from source (lockfile pins correct git source with CPU backend)
            uv sync --frozen --active --inexact \
              --no-build-isolation-package vllm \
              --no-build-isolation-package torch-spyre
            cd /dev/shm

            python3 -c "import vllm; print('vLLM version:', vllm.__version__)"
            python3 -c "import torch; print('torch.ops._C.init_cpu_memory_env' in dir(torch.ops._C))" || true

            # ---- Phase 3: Install benchmark dependencies ----
            uv pip install pyyaml 2>/dev/null || pip install pyyaml
            which jq || (apt-get update -qq && apt-get install -y -qq jq 2>/dev/null) || true

            # ---- Phase 4: Clone benchmark suite ----
            echo "=== Cloning benchmark suite from ${BENCHMARK_REPO} (branch: ${BENCHMARK_BRANCH}) ==="
            git clone -b "${BENCHMARK_BRANCH}" "${BENCHMARK_REPO}" benchmark-suite
            cd benchmark-suite

            # ---- Phase 5: Run benchmarks ----
            echo "=== Starting benchmarks ==="
            bash scripts/run_benchmarks.sh 2>&1 | tee /tmp/benchmark.log

            echo "===== BENCHMARK COMPLETE ====="
      volumeMounts:
        - name: dev-shm
          mountPath: /dev/shm
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
  restartPolicy: Never
  imagePullSecrets:
    - name: ai-sw-accel-pull-secret
  serviceAccount: default
  volumes:
    - name: dev-shm
      emptyDir: {}
